name: Android Flutter

on:
  pull_request:
    paths: ['mobile/**', 'calendar-data/**', '.github/workflows/android.yml']
  push:
    paths: ['mobile/**', 'calendar-data/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: flutter pub get --enforce-lockfile
      - run: bash tool/verify.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: niu-life-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
