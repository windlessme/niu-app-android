name: Android Flutter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r ../calendar-data/requirements.txt
      - name: Validate calendar and published history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python3 ../calendar-data/scripts/validate.py --base-ref "$BASE_SHA"
          else
            python3 ../calendar-data/scripts/validate.py
          fi
      - run: python3 -m unittest discover -s ../calendar-data/tests -v
      - run: flutter pub get --enforce-lockfile
      - run: bash tool/verify.sh
        env:
          FLUTTER_TEST_CONCURRENCY: '2'
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: niu-life-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
