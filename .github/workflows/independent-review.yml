name: Independent review record

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to recheck once this workflow exists on main
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: independent-review-records
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never checkout or execute PR code in this write-permission workflow.
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number || github.event.issue.number }}
        with:
          script: |
            const repo = context.repo;
            const numbers = context.eventName === 'push'
              ? (await github.paginate(github.rest.pulls.list, {...repo, state: 'open', base: 'main', per_page: 100})).map(pr => pr.number)
              : [Number(process.env.PR_NUMBER)];
            for (const number of numbers) {
              if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid PR number');
              await verify(number);
            }
            async function verify(number) {
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
            if (pr.state !== 'open' || pr.base.ref !== 'main') return;
            const status = (state, description, url) => github.rest.repos.createCommitStatus({
              ...repo, sha: pr.head.sha, context: 'Independent code review', state,
              description, target_url: url || pr.html_url
            });
            // Immediately revoke an earlier success while revalidating records.
            await status('pending', 'Revalidating independent review for current HEAD');
            const marker = `<!-- niu-code-review:${pr.head.sha}:base:${pr.base.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {...repo, issue_number: number, per_page: 100});
            let record;
            for (const comment of comments.reverse()) {
              if (!comment.body.includes(marker) || comment.user.type !== 'User') continue;
              let data;
              try {
                ({data} = await github.rest.repos.getCollaboratorPermissionLevel({...repo, username: comment.user.login}));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (['admin', 'maintain', 'write'].includes(data.permission)) { record = comment; break; }
            }
            // Only ever certify the exact SHA quoted in the maintainer's record.
            // Deleted/edited records no longer authorize this exact SHA.
            const {data: current} = await github.rest.pulls.get({...repo, pull_number: number});
            if (current.head.sha !== pr.head.sha || current.base.sha !== pr.base.sha || current.base.ref !== pr.base.ref) throw new Error('PR changed during verification');
            if (!record) {
              await status('failure', 'No authorized independent review record for current HEAD');
              return;
            }
            await status('success', 'Maintainer-attested independent agent review recorded', record.html_url);
            }
