name: Independent review record

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to recheck once this workflow exists on main
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: independent-review-records
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never checkout or execute PR code in this write-permission workflow.
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number || github.event.issue.number }}
        with:
          script: |
            const repo = context.repo;
            // Concurrency can replace queued runs. Every surviving event must
            // reconcile all open PRs, not only the event's own PR.
            if (context.eventName === 'workflow_dispatch' &&
                (!Number.isSafeInteger(Number(process.env.PR_NUMBER)) || Number(process.env.PR_NUMBER) <= 0)) {
              throw new Error('Invalid PR number');
            }
            const list = () => github.paginate(github.rest.pulls.list, {...repo, state: 'open', base: 'main', per_page: 100});
            const groups = new Map();
            for (const pr of await list()) {
              if (!groups.has(pr.head.sha)) groups.set(pr.head.sha, []);
              groups.get(pr.head.sha).push(pr);
            }
            const failures = [];
            for (const [sha, prs] of groups) {
              try { await reconcile(sha, prs); }
              catch (error) { failures.push(sha); core.error(`Review reconciliation failed for ${sha}: ${error.message}`); }
            }
            if (failures.length) core.setFailed(`Unable to reconcile HEADs: ${failures.join(', ')}`);
            async function reconcile(sha, prs) {
              const name = 'Independent code review';
              const existing = await github.paginate(github.rest.checks.listForRef, {...repo, ref: sha, check_name: name, per_page: 100});
              const own = existing.find(check => check.app?.slug === 'github-actions' && check.external_id === 'niu-independent-review-v1');
              const running = {status: 'in_progress', output: {title: 'Revalidating review records', summary: 'Every open main PR sharing this HEAD must have its own current-base review.'}};
              const {data: check} = own
                ? await github.rest.checks.update({...repo, check_run_id: own.id, ...running})
                : await github.rest.checks.create({...repo, name, head_sha: sha, external_id: 'niu-independent-review-v1', ...running});
              try {
                const records = [];
                let approved = true;
                for (const pr of prs) {
                  const marker = `<!-- niu-code-review:${sha}:base:${pr.base.sha} -->`;
                  const comments = await github.paginate(github.rest.issues.listComments, {...repo, issue_number: pr.number, per_page: 100});
                  let record;
                  for (const comment of comments.reverse()) {
                    if (!comment.body.includes(marker) || comment.user.type !== 'User') continue;
                    let permission;
                    try { permission = (await github.rest.repos.getCollaboratorPermissionLevel({...repo, username: comment.user.login})).data.permission; }
                    catch (error) { if (error.status === 404) continue; throw error; }
                    if (['admin', 'maintain', 'write'].includes(permission)) { record = comment; break; }
                  }
                  if (!record) approved = false;
                  records.push(record ? `PR #${pr.number}: ${record.html_url}` : `PR #${pr.number}: no authorized record`);
                }
                // Check membership and base revisions again before certifying the group.
                const signature = rows => rows.map(pr => `${pr.number}:${pr.head.sha}:${pr.base.ref}:${pr.base.sha}`).sort().join('|');
                const current = (await list()).filter(pr => pr.head.sha === sha);
                if (signature(current) !== signature(prs)) throw new Error('PR group changed during verification');
                await github.rest.checks.update({...repo, check_run_id: check.id, status: 'completed', conclusion: approved ? 'success' : 'failure',
                  output: {title: approved ? 'All PR review records verified' : 'Independent review required', summary: records.join('\n')}});
              } catch (error) {
                await github.rest.checks.update({...repo, check_run_id: check.id, status: 'completed', conclusion: 'failure',
                  output: {title: 'Review verification incomplete', summary: 'Re-run after resolving API errors or concurrent PR changes.'}});
                throw error;
              }
            }
