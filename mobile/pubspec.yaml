name: niu_mobile
description: NIU-Life Android campus companion.
publish_to: none
version: 1.0.3+84

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.0
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.2
  html: ^0.15.7
  cupertino_icons: ^1.0.9
  screen_brightness: ^2.1.11
  in_app_update: ^5.0.0
  pointycastle: ^4.0.0
  google_mlkit_text_recognition: ^0.17.1
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/academic_calendar/index.json
    - assets/academic_calendar/years/
    - assets/LICENSE
    - assets/demo/
